# Configurações do REMUS Livre
title: REMUS Livre
description: Repositório de Recursos Educacionais Abertos para Educação Musical
author: NECT - Núcleo de Estudos e Pesquisas sobre Educação, Comunicação e Tecnologia
email: nelsonpombojr@gmail.com

# Tema (usamos "minimal" como base, mas com CSS personalizado)
theme: jekyll-theme-minimal

# Configurações de marca
brand:
  primary_color: "#0366D6"      # Ocean Blue
  secondary_color: "#24292E"    # Onyx Black
  background_color: "#F6F8FA"   # Chalk White
  accent_color: "#E1E4E8"       # Pebble Gray
  font_family: "'Alegreya SC', Georgia, serif"

# Navegação (links no topo)
navigation:
  - title: Início
    url: /
  - title: Recursos
    url: /recursos/
  - title: Experiências
    url: /experiencias/
  - title: Biblioteca
    url: /biblioteca/
  - title: Trilhas
    url: /trilhas/
  - title: Diário
    url: /diario/

# Coleções
collections:
  diario:
    output: true
    permalink: /diario/:name/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
